{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ClassyFire Batch Cache{% endblock %}</title>
  <!-- htmx is self-hosted (served from 'self') so the app's strict CSP
       (script-src 'self') allows it — loading it from a CDN was being blocked. -->
  <script src="{% static 'htmx.min.js' %}"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"></script>
  <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
  <nav>
    <a href="/">Submit Batch</a>
    &nbsp;|&nbsp;
    <a href="/stats/">DB Status</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'app.js' %}"></script>
</body>
</html>
