# =============================================================================
# ClassyFire Batch Web — Docker Compose
#
# Network topology
# ─────────────────
#   internal  : db, backup              (no internet access)
#   external  : proxy, ngrok-agent      (outbound/ngrok-facing only)
#   web and worker are on BOTH networks so they can reach db (internal)
#   and also make outbound internet requests (external).
#   proxy and ngrok-agent are also on `internal` so they can reach `web`.
#
# Port policy
# ───────────
#   db, web, worker, backup → NO host-published ports
#   proxy                   → NO host-published ports; ngrok reaches proxy internally
#   ngrok-agent             → connects outbound to ngrok cloud (no inbound port)
#
# Usage
# ─────
#   cp .env.example .env        # fill in secrets
#   docker compose up -d
# =============================================================================

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  static_files:
  media_files:
  caddy_data:
  caddy_config:
  backup_data:
  # Gate-2 WS-E (F-12): persistent export artifact storage.
  # Mounted into web and worker so exports survive container recreation.
  export_files:
  # Gate-6 T-4: source artifacts (Zenodo JSON files) on a dedicated volume.
  source_artifacts:
  # H-04: raw upload spool shared between web (writer) and ingest-worker (reader).
  # Without this named volume the two containers each see their own empty /app/uploads.
  uploads:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
    internal: true   # no direct internet access from db/web/worker
  external:
    driver: bridge   # proxy + ngrok-agent face the internet

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classyfire}
      POSTGRES_USER: ${POSTGRES_USER:-classyfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classyfire}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NO ports: block — db is internal-only

  # ── Volume permissions (one-shot) ────────────────────────────────────────
  volume-init:
    build: .
    restart: "no"
    user: "0:0"
    network_mode: "none"
    command:
      - sh
      - -c
      - >-
        set -eu;
        mkdir -p /app/staticfiles /app/media /app/export_files /app/source_artifacts /app/uploads;
        chown -R 1001:1001 /app/staticfiles /app/media /app/export_files /app/source_artifacts /app/uploads
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - export_files:/app/export_files
      - source_artifacts:/app/source_artifacts
      - uploads:/app/uploads

  # ── Migrations (one-shot) ────────────────────────────────────────────────
  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    command:
      - python
      - manage.py
      - migrate
      - "--noinput"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - internal
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # ── Static files (one-shot) ──────────────────────────────────────────────
  # collectstatic must run at RUNTIME into the static_files named volume: that
  # volume shadows the image's /app/staticfiles, so static collected at build
  # time never reaches runtime. Re-running on every `up` keeps the volume in
  # sync with the image (CSS/JS/htmx + the ManifestStaticFilesStorage manifest),
  # so a rebuild no longer needs a manual `docker compose run ... collectstatic`.
  collectstatic:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command:
      - python
      - manage.py
      - collectstatic
      - "--noinput"
    volumes:
      - static_files:/app/staticfiles
    networks:
      - internal
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # ── Web (Gunicorn) ────────────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    command:
      - gunicorn
      - config.wsgi:application
      - "--bind=0.0.0.0:8000"
      - "--workers=2"
      - "--timeout=120"
      # Caddy is the canonical access logger and skips secret-bearing job URLs.
      # Keep Gunicorn access logs disabled so raw upstream paths are not emitted.
      - "--access-logfile=/dev/null"
      - "--error-logfile=-"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Gate-2 WS-E (F-12): persistent export storage survives container recreation
      - export_files:/app/export_files
      # Gate-6 T-4: source artifact volume for Zenodo JSON files
      - source_artifacts:/app/source_artifacts
      # H-04: upload spool volume — web spools raw uploads here before the worker reads them
      - uploads:/app/uploads
      # Seed dataset (read-only): the ~2GB seed .tsv.zst + chemont_dictionary.tsv
      # live in the gitignored ./seed_cache and are NOT baked into the image.
      # Mounted here so `docker compose run --rm web python manage.py seed_import
      # --source /app/seed_cache/<file>` (and import_chemont) work by default.
      # If ./seed_cache is absent on the host, Docker creates an empty dir — the
      # seed commands simply have nothing to import until you populate it.
      - ./seed_cache:/app/seed_cache:ro
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      collectstatic:
        condition: service_completed_successfully
    expose:
      - "8000"
    # NO ports: block — accessed only through proxy

  # ── Worker ────────────────────────────────────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    # runworker management command is added in Task 9
    command:
      - python
      - manage.py
      - runworker
    volumes:
      - media_files:/app/media
      # Gate-2 WS-E (F-12): shared export storage
      - export_files:/app/export_files
      # Gate-6 T-4: source artifact volume
      - source_artifacts:/app/source_artifacts
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # NO ports: block — background process only

  # ── Ingest Worker (default, always-on) ───────────────────────────────────
  ingest-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    command:
      - python
      - manage.py
      - process_jobs
    volumes:
      - media_files:/app/media
      - export_files:/app/export_files
      # Gate-6 T-4: source artifact volume
      - source_artifacts:/app/source_artifacts
      # H-04: upload spool volume — ingest-worker reads spooled files written by web
      - uploads:/app/uploads
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Cleanup (scheduled loop, runs by default) ────────────────────────────
  cleanup:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
    command: ["sh", "-c", "while true; do python manage.py cleanup_expired; sleep 86400; done"]
    volumes:
      - media_files:/app/media
      # Gate-2 WS-E (F-12): access export files for pruning
      - export_files:/app/export_files
      # H-04: upload spool volume — cleanup reaps stale upload temps
      - uploads:/app/uploads
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ── Backup ────────────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-classyfire}
      POSTGRES_USER: ${POSTGRES_USER:-classyfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - media_files:/app/media:ro
      - export_files:/app/export_files:ro
      - source_artifacts:/app/source_artifacts:ro
      # H-04: upload spool volume — backup.sh reads UPLOAD_DIR for artifact archiving
      - uploads:/app/uploads:ro
      - backup_data:/backups
    networks:
      - internal
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # Run backup on a schedule via supercronic / cron inside the container.
    # The backup.sh script itself is implemented in Task 10.
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    # NO ports: block — background process only

  # ── Reverse proxy (Caddy) ─────────────────────────────────────────────────
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/app/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - external
    depends_on:
      - web
    # NO ports: ngrok reaches Caddy over the internal Docker network (proxy:80).
    # Publishing this HTTP listener to the host would let direct cleartext
    # requests bypass Django's SECURE_SSL_REDIRECT because Caddy must mark
    # ngrok-forwarded requests as HTTPS.

  # ── ngrok agent ───────────────────────────────────────────────────────────
  ngrok-agent:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # ngrok reads the authtoken natively from NGROK_AUTHTOKEN (above). The agent
    # does NOT expand ${...} placeholders inside a YAML config file, so the old
    # mounted ngrok.yml.template passed the literal "${NGROK_AUTHTOKEN}" and
    # failed with ERR_NGROK_105. Forward the reserved domain straight to the Caddy
    # proxy; docker compose substitutes ${NGROK_DOMAIN} from .env at parse time.
    command:
      - "http"
      - "proxy:80"
      - "--url=https://${NGROK_DOMAIN}"
      - "--log=stdout"
      - "--log-format=json"
    networks:
      - internal
      - external
    depends_on:
      - proxy
    # NO ports: ngrok connects outbound to ngrok cloud — no inbound host ports
