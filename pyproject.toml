[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ClassyFire"
version = "0.1.0"
description = "Django batch web app for chemical data with RDKit and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Daehwan Kim", email = "kdh5358@snu.ac.kr"}]

dependencies = [
    "django>=4.2,<5.0",
    "gunicorn>=21.0,<22.0",
    "psycopg[binary]>=3.1,<4.0",
    "httpx>=0.24,<1.0",
    "python-dotenv>=1.0,<2.0",
    "zstandard>=0.21,<1.0",
    "django-htmx>=1.16,<2.0",
    "whitenoise>=6.4,<7.0",
    "pydantic>=2.0,<3.0",
    "rdkit>=2026.03,<2027.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-django>=4.5,<5.0",
    "pytest-xdist>=3.3,<4.0",
    "ruff>=0.1,<1.0",
    "mypy>=1.5,<2.0",
    "types-requests>=2.31,<3.0",
    "playwright>=1.40,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "node_modules",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PIE",
    "RUF",
    "DJ",
]
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
]
extend-safe-fixes = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "zstandard",
    "psycopg",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
testpaths = ["apps"]
