[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ClassyFire"
version = "0.1.0"
description = "Django batch web app for chemical data with RDKit and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Daehwan Kim", email = "kdh5358@snu.ac.kr"}]

dependencies = [
    "django>=5.2,<6.0",
    "gunicorn>=23.0,<27.0",
    "psycopg[binary]>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "zstandard>=0.23,<1.0",
    "django-htmx>=1.21,<2.0",
    "whitenoise>=6.7,<7.0",
    "pydantic>=2.9,<3.0",
    "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-django>=4.9,<5.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<3.0",
    "django-stubs>=5.1,<6.0",
    "types-requests>=2.31,<3.0",
    "playwright>=1.40,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "node_modules",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "stubs",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PIE",
    "RUF",
    "DJ",
]
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    # The data model intentionally uses nullable text columns (e.g. zinc_id,
    # remote_query_id, source_ref). The spec mandates them and a future Go/Rust
    # port reads NULL vs empty distinctly, so DJ001 does not apply here.
    "DJ001",
]
extend-safe-fixes = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Django's Meta inner-class declares constraints/indexes/ordering as class-level
# lists by design; these are not mutable-default bugs.
"apps/**/models.py" = ["RUF012"]
# Migration files are generated by Django; do not hand-edit for lint style.
"apps/**/migrations/*.py" = ["RUF012", "E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# stubs/ contains minimal corrected rdkit stubs that override the broken
# rdkit-stubs shipped with the rdkit wheel (rdchem.pyi has a SyntaxError in
# the default/autoConvert parameter ordering).
mypy_path = ["stubs"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "zstandard",
    "psycopg",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
testpaths = ["tests", "apps"]
filterwarnings = [
    # WhiteNoise warns when STATIC_ROOT has no collected files. Static is
    # collected at Docker build time (`collectstatic`); in the test env it is
    # absent and harmless. Keep test output pristine without hiding real issues.
    "ignore:No directory at:UserWarning",
]
