services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-classyfire}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-classyfire}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-classyfire}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_TEST_USER:-classyfire} -d ${POSTGRES_TEST_DB:-classyfire}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
